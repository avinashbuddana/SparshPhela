[build]
  base    = "frontend"
  command = "yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  REACT_APP_BACKEND_URL = ""
  REACT_APP_SITE_URL    = "https://sparshpehla.netlify.app"

# ── Proxy: /api/* → Railway backend ─────────────────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "https://sparshphela-production.up.railway.app/api/:splat"
  status = 200
  force  = true

# ── Proxy: dynamic sitemap ───────────────────────────────────────────────────
[[redirects]]
  from   = "/sitemap.xml"
  to     = "https://sparshphela-production.up.railway.app/sitemap.xml"
  status = 200
  force  = true

# ── SPA fallback — React Router ──────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
