version: "3.9"

services:
  app:
    build:
      context: .
      args:
        REACT_APP_BACKEND_URL: ""
        REACT_APP_SITE_URL: http://localhost
    container_name: sparsh-pehla
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      FRONTEND_URL: http://localhost
      SITE_URL: http://localhost
    volumes:
      # Persist uploaded images across container restarts
      - sparsh-media:/app/media

volumes:
  sparsh-media:
